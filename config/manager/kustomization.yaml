resources:
- manager.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
images:
- name: controller
  newName: quay.io/konveyor/oadp-operator
  newTag: latest
configMapGenerator:
- name: cli-download-config
  literals:
  - cli-download-enabled=false
  - vmdp-download-enabled=false
generatorOptions:
  disableNameSuffixHash: true
